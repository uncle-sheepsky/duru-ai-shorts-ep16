<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ep16 G6 — 컴프 유지 시간 측정기</title>
<!--
  ★comp.html 과 별도 파일인 이유: 본편 조립 파일을 건드리면 SRC_SHA 가 바뀌어
    code_data.js 와 렌더된 frames/ 가 통째로 스테일이 된다. 게이트가 산출물을 흔들면 안 된다.

  ★이 파일이 하는 일 = `BEATS.setFreeze(gf)` 로 **상시 모션을 고정**하고 컴프 빌드만 남긴다.
    상시 모션(결과물 재생·커서 점멸·자기참조 NOW 마커·워드싱크 자막)은 결함이 아니라 설계인데,
    그걸 끄지 않고 프레임 차이를 재면 「유지 0f」가 찍힌다(ep15 v4 에서 지표가 두 번 오염됐다).
    ⇒ 재려는 것을 재려면 **변해도 되는 것을 먼저 정의**해야 한다.
-->
<style>
  @font-face { font-family:JetBrains; src:url("../_fonts/JetBrainsMono.ttf") }
  @font-face { font-family:Pretendard; font-weight:800; src:url("../_fonts/Pretendard-ExtraBold.otf") }
  @font-face { font-family:PretendardBlack; font-weight:900; src:url("../_fonts/Pretendard-Black.otf") }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c0d}
  canvas{display:block;width:1080px;height:1920px}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="code_data.js"></script>
<script src="beats16.js"></script>
<script>
(() => {
  const B = window.BEATS;
  const g = document.getElementById('cv').getContext('2d', { alpha:false });
  B.setCtx(g);
  window.__comp = B.COMP;
  window.__beats = B.NB;
  window.__fps = B.FPS;

  // 컴프 k 의 로컬 프레임 lf 만 그린다. 상시 모션은 그 컴프의 **마지막 글로벌 프레임**에 고정.
  window.__drawHold = (k, lf) => {
    const c = B.COMP[k];
    B.setFreeze(c.f0 + c.len - 1);
    B.setFrame(c.f0 + lf);
    B.COMPFN[k](lf);
    B.caption(c.f0 + lf);
    B.setFreeze(null);
  };

  window.__ready = false;
  Promise.all(B.allImages().map(im => im.complete && im.naturalWidth
      ? Promise.resolve() : new Promise(r => { im.onload = r; im.onerror = r; })))
    .then(() => B.fontsReady())
    .then(() => { window.__drawHold(0, 0); window.__ready = true; });
})();
</script>
</body>
</html>
