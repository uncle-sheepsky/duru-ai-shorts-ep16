<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ep16 f0 썸네일 후보 대조</title>
<!-- ★comp.html 과 별도. 본편 조립 파일을 건드리면 SRC_SHA 가 흔들린다. -->
<style>
  @font-face { font-family:JetBrains; src:url("../_fonts/JetBrainsMono.ttf") }
  @font-face { font-family:Pretendard; font-weight:800; src:url("../_fonts/Pretendard-ExtraBold.otf") }
  @font-face { font-family:PretendardBlack; font-weight:900; src:url("../_fonts/Pretendard-Black.otf") }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c0d}
  canvas{display:block;width:1080px;height:1920px}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="code_data.js"></script>
<script src="beats16.js"></script>
<script>
(() => {
  const B = window.BEATS;
  B.setCtx(document.getElementById('cv').getContext('2d', { alpha:false }));
  window.__variants = Object.keys(B.THUMB);
  window.__drawThumb = v => { B.setFrame(0); B.THUMB[v](); };
  window.__ready = false;
  Promise.all(B.allImages().map(im => im.complete && im.naturalWidth
      ? Promise.resolve() : new Promise(r => { im.onload = r; im.onerror = r; })))
    .then(() => B.fontsReady())
    .then(() => { window.__drawThumb('A'); window.__ready = true; });
})();
</script>
</body>
</html>
